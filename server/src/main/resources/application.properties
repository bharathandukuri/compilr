spring.application.name=compilr
server.port=8080

# Compilr Execution Docker Configuration
compilr.execution.docker.enabled=true
compilr.execution.docker.host=unix:///var/run/docker.sock

# Compilr Sandbox & Resource Constraints
compilr.compiler.max-source-size-bytes=262144
compilr.compiler.max-stdin-size-bytes=262144
compilr.compiler.max-output-size-bytes=1048576
compilr.compiler.default-time-limit-ms=5000
compilr.compiler.max-time-limit-ms=15000
compilr.compiler.min-time-limit-ms=100
compilr.compiler.default-memory-limit-kb=262144

# OpenAPI & Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha

# Logging Configuration
logging.level.com.bharathandukuri.compilr=INFO
logging.pattern.console=%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%5p) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n

# Redis Configuration
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD:stacked_redis_secret}
spring.data.redis.timeout=2000ms

# Rate Limiting & Execution Queue Protection
compilr.protection.rate-limit.enabled=true
compilr.protection.rate-limit.max-requests=15
compilr.protection.rate-limit.window-seconds=60

compilr.protection.queue.default-processing-capacity=3
compilr.protection.queue.default-queue-capacity=10
compilr.protection.queue.max-queue-wait-timeout-ms=10000
compilr.protection.queue.global-max-processing=12
compilr.protection.queue.global-max-queued=50


