spring.application.name=compilr
server.port=8080

# Compilr Execution Docker Configuration
compilr.execution.docker.enabled=true
compilr.execution.docker.host=unix:///var/run/docker.sock

# Compilr Sandbox & Resource Constraints
compilr.compiler.max-source-size-bytes=${MAX_SOURCE_SIZE_BYTES:${COMPILR_COMPILER_MAX_SOURCE_SIZE_BYTES:262144}}
compilr.compiler.max-stdin-size-bytes=${MAX_STDIN_SIZE_BYTES:${COMPILR_COMPILER_MAX_STDIN_SIZE_BYTES:262144}}
compilr.compiler.max-output-size-bytes=${MAX_OUTPUT_SIZE_BYTES:${COMPILR_COMPILER_MAX_OUTPUT_SIZE_BYTES:1048576}}
compilr.compiler.default-time-limit-ms=${DEFAULT_TIMEOUT_MS:${COMPILR_COMPILER_DEFAULT_TIME_LIMIT_MS:5000}}
compilr.compiler.max-time-limit-ms=${MAX_TIMEOUT_MS:${COMPILR_COMPILER_MAX_TIME_LIMIT_MS:15000}}
compilr.compiler.min-time-limit-ms=${MIN_TIMEOUT_MS:${COMPILR_COMPILER_MIN_TIME_LIMIT_MS:100}}
compilr.compiler.default-memory-limit-kb=${DEFAULT_MEMORY_LIMIT_KB:${COMPILR_COMPILER_DEFAULT_MEMORY_LIMIT_KB:262144}}

# OpenAPI & Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha

# Logging Configuration
logging.level.com.bharathandukuri.compilr=${LOG_LEVEL:INFO}
logging.pattern.console=%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%5p) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n

# Redis Configuration
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD:stacked_redis_secret}
spring.data.redis.timeout=2000ms

# Rate Limiting & Execution Queue Protection
compilr.protection.rate-limit.enabled=${RATE_LIMIT_ENABLED:${COMPILR_PROTECTION_RATE_LIMIT_ENABLED:true}}
compilr.protection.rate-limit.max-requests=${RATE_LIMIT_MAX_REQUESTS:${COMPILR_PROTECTION_RATE_LIMIT_MAX_REQUESTS:15}}
compilr.protection.rate-limit.window-seconds=${RATE_LIMIT_WINDOW_SECONDS:${COMPILR_PROTECTION_RATE_LIMIT_WINDOW_SECONDS:60}}

compilr.protection.queue.default-processing-capacity=${DEFAULT_PROCESSING_CAPACITY:${COMPILR_PROTECTION_QUEUE_DEFAULT_PROCESSING_CAPACITY:3}}
compilr.protection.queue.default-queue-capacity=${DEFAULT_QUEUE_CAPACITY:${COMPILR_PROTECTION_QUEUE_DEFAULT_QUEUE_CAPACITY:10}}
compilr.protection.queue.max-queue-wait-timeout-ms=${MAX_QUEUE_WAIT_TIMEOUT_MS:${COMPILR_PROTECTION_QUEUE_MAX_QUEUE_WAIT_TIMEOUT_MS:10000}}
compilr.protection.queue.global-max-processing=${MAX_CONCURRENT_JOBS:${COMPILR_PROTECTION_QUEUE_GLOBAL_MAX_PROCESSING:12}}
compilr.protection.queue.global-max-queued=${GLOBAL_MAX_QUEUED:${COMPILR_PROTECTION_QUEUE_GLOBAL_MAX_QUEUED:50}}


